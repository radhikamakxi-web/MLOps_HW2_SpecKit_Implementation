[project]
name = "zeroshot-mlops"
version = "0.1.0"
description = "Zero-shot text classification platform with Streamlit, Hugging Face, and MinIO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "minio>=7.2.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "huggingface_hub>=0.23.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
